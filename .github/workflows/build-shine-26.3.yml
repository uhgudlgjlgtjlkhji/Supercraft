name: Build Shine 26.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build workspace
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract the porter-generated source
        shell: bash
        run: |
          test -f Shine-main-ported-26_3.zip
          mkdir -p ported-src
          unzip -q Shine-main-ported-26_3.zip -d ported-src
          WRAPPER="$(find ported-src -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found in the uploaded porter ZIP."
            find ported-src -maxdepth 4 -type f | head -100
            exit 1
          fi
          SOURCE_DIR="$(dirname "$WRAPPER")"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Using source directory: $SOURCE_DIR"
          echo "---- Gradle properties ----"
          sed -n '1,160p' "$SOURCE_DIR/gradle.properties"
          echo "---- Build configuration ----"
          sed -n '1,220p' "$SOURCE_DIR/build.gradle"

      - name: Make Gradle wrapper executable
        run: chmod +x "$SOURCE_DIR/gradlew"

      - name: Build porter-generated source
        run: cd "$SOURCE_DIR" && ./gradlew build --no-daemon --stacktrace

      - name: Upload build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shine-26.3-porter-build
          path: |
            ported-src/**/build/libs/*.jar
            ported-src/**/build/reports/
          if-no-files-found: warn
          retention-days: 14
