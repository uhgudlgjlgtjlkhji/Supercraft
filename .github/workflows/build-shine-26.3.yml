name: Build Shine 26.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out build workspace
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract the porter-generated source
        shell: bash
        run: |
          test -f Shine-main-ported-26_3.zip
          mkdir -p ported-src
          unzip -q Shine-main-ported-26_3.zip -d ported-src
          WRAPPER="$(find ported-src -type f -name gradlew -print -quit)"
          if [ -z "$WRAPPER" ]; then
            echo "No Gradle wrapper found in the uploaded porter ZIP."
            find ported-src -maxdepth 4 -type f | head -100
            exit 1
          fi
          SOURCE_DIR="$(dirname "$WRAPPER")"
          echo "SOURCE_DIR=$SOURCE_DIR" >> "$GITHUB_ENV"
          echo "Using source directory: $SOURCE_DIR"
          echo "---- Gradle properties ----"
          sed -n '1,160p' "$SOURCE_DIR/gradle.properties"
          echo "---- Build configuration ----"
          sed -n '1,220p' "$SOURCE_DIR/build.gradle"


      - name: Fix remaining Gradle dependency configurations
        shell: bash
        run: |
          python3 - "$SOURCE_DIR" <<'PY'
          from pathlib import Path
          import re, sys
          root = Path(sys.argv[1])
          p = root / "build.gradle"
          s = p.read_text()
          s = s.replace("modImplementation", "implementation")
          s = s.replace("modCompileOnly", "compileOnly")
          s = s.replace("modLocalRuntime", "runtimeOnly")
          s = s.replace("maven.modrinth:sodium:mc1.21.11-0.8.6-fabric",
                        "maven.modrinth:sodium:mc26.3-0.9.2-fabric")
          p.write_text(s)
          p = root / "gradle.properties"
          s = p.read_text()
          values = {
              "loom_version": "1.18-SNAPSHOT",
              "modmenu_version": "21.0.0-beta.1",
              "yacl_version": "3.9.6+26.3-fabric",
          }
          for key, value in values.items():
              s = re.sub(rf"(?m)^{key}=.*$", f"{key}={value}", s)
          p.write_text(s)
          wrapper = root / "gradle/wrapper/gradle-wrapper.properties"
          if wrapper.exists():
              s = wrapper.read_text().replace("gradle-9.6.0-bin.zip", "gradle-9.7.1-bin.zip")
              wrapper.write_text(s)
          PY

      - name: Make Gradle wrapper executable
        run: chmod +x "$SOURCE_DIR/gradlew"

      - name: Build porter-generated source
        run: cd "$SOURCE_DIR" && ./gradlew build --no-daemon --stacktrace

      - name: Upload build output and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shine-26.3-porter-build
          path: |
            ported-src/**/build/libs/*.jar
            ported-src/**/build/reports/
          if-no-files-found: warn
          retention-days: 14
